[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-insight-pipeline"
version = "0.1.0"
description = "Auditable Spotify review preparation and bounded Jev enrichment"
requires-python = ">=3.10"
dependencies = ["vaderSentiment==3.3.2"]

[project.optional-dependencies]
database = ["psycopg[binary]==3.2.13"]

[tool.setuptools.packages.find]
where = ["src"]
