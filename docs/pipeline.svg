<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1320" viewBox="0 0 1760 1320"><title>Spotify pipeline actual saved execution</title><desc>Six stages with actual completed scope, code and model boundaries, saved evidence, stop and retry controls, and deployed data flow.</desc><rect width="1760" height="1320" fill="#fbfcff"/><g font-family="Menlo, monospace"><text x="52" y="66" fill="#2151b9" font-size="32" font-weight="700">Spotify insight pipeline</text><text x="52" y="107" fill="#667085" font-size="19" font-weight="400">Blue = code / storage     Purple = model judgment     Green = reviewed publication</text><text x="52" y="145" fill="#147c5b" font-size="21" font-weight="700">244,582 completed reviews · 660,622 source rows</text><path d="M72,216 L72,1110" fill="none" stroke="#8699b3" stroke-width="3"/><circle cx="72" cy="214" r="19" fill="#e3ecff" stroke="#2151b9" stroke-width="3"/><rect x="108" y="185" width="1030" height="145" rx="14" fill="#ffffff" stroke="#d9e3f3" stroke-width="2"/><text x="130" y="221" fill="#2151b9" font-size="24" font-weight="700">1  PREPARE · PYTHON / SQLITE</text><text x="130" y="254" fill="#344054" font-size="18" font-weight="400">Full CSV → profile, original IDs, hashes and queue</text><text x="130" y="276" fill="#344054" font-size="18" font-weight="400">660,622 source rows; 13 empty texts quarantined</text><text x="130" y="298" fill="#344054" font-size="18" font-weight="400">Saved: ingestion.json, quarantine log, source SQLite</text><circle cx="72" cy="372" r="19" fill="#e9e2ff" stroke="#7026d4" stroke-width="3"/><rect x="108" y="343" width="1030" height="145" rx="14" fill="#ffffff" stroke="#d9e3f3" stroke-width="2"/><text x="130" y="379" fill="#7026d4" font-size="24" font-weight="700">2  CLASSIFY · JEV + LOCAL CODE</text><text x="130" y="412" fill="#344054" font-size="18" font-weight="400">Review text + fixed rubric → validated labels</text><text x="130" y="434" fill="#344054" font-size="18" font-weight="400">Jev topic/intent + conditional severity; VADER sentiment</text><text x="130" y="456" fill="#344054" font-size="18" font-weight="400">244,582 complete; 416,027 nonempty reviews incomplete</text><text x="130" y="478" fill="#344054" font-size="18" font-weight="400">Saved: records, partial state, per-attempt handoffs</text><circle cx="72" cy="530" r="19" fill="#e9e2ff" stroke="#7026d4" stroke-width="3"/><rect x="108" y="501" width="1030" height="145" rx="14" fill="#ffffff" stroke="#d9e3f3" stroke-width="2"/><text x="130" y="537" fill="#7026d4" font-size="24" font-weight="700">3  VERIFY · SEPARATE BLIND JEV TASK</text><text x="130" y="570" fill="#344054" font-size="18" font-weight="400">1,000 original texts + rubric → second judgments</text><text x="130" y="592" fill="#344054" font-size="18" font-weight="400">No first-answer labels in payload; 193 disagreements</text><text x="130" y="614" fill="#344054" font-size="18" font-weight="400">Saved: verification.json + inspected disagreements</text><circle cx="72" cy="688" r="19" fill="#e3ecff" stroke="#2151b9" stroke-width="3"/><rect x="108" y="659" width="1030" height="145" rx="14" fill="#ffffff" stroke="#d9e3f3" stroke-width="2"/><text x="130" y="695" fill="#2151b9" font-size="24" font-weight="700">4  GROUP · CODE</text><text x="130" y="728" fill="#344054" font-size="18" font-weight="400">15,825 complaint/cancellation reviews → 8 topic groups</text><text x="130" y="750" fill="#344054" font-size="18" font-weight="400">Stable issue IDs; preserve every contributing review ID</text><text x="130" y="772" fill="#344054" font-size="18" font-weight="400">Saved: membership.csv + aggregate_evidence.json</text><circle cx="72" cy="846" r="19" fill="#e3ecff" stroke="#2151b9" stroke-width="3"/><rect x="108" y="817" width="1030" height="145" rx="14" fill="#ffffff" stroke="#d9e3f3" stroke-width="2"/><text x="130" y="853" fill="#2151b9" font-size="24" font-weight="700">5  RANK · CODE</text><text x="130" y="886" fill="#344054" font-size="18" font-weight="400">Membership + severity → integer severity sums</text><text x="130" y="908" fill="#344054" font-size="18" font-weight="400">Count × unrounded mean; ties: ascending issue ID</text><text x="130" y="930" fill="#344054" font-size="18" font-weight="400">Saved: ranking.csv + claims.csv</text><text x="130" y="952" fill="#344054" font-size="18" font-weight="400">Saved flag-sensitivity comparison</text><circle cx="72" cy="1004" r="19" fill="#e9e2ff" stroke="#7026d4" stroke-width="3"/><rect x="108" y="975" width="1030" height="145" rx="14" fill="#ffffff" stroke="#d9e3f3" stroke-width="2"/><text x="130" y="1011" fill="#7026d4" font-size="24" font-weight="700">6  NAME &amp; RECOMMEND · LOCAL QWEN + REVIEW</text><text x="130" y="1044" fill="#344054" font-size="18" font-weight="400">Separate naming and writing calls use bounded evidence</text><text x="130" y="1066" fill="#344054" font-size="18" font-weight="400">Ranked metrics + selected quotes → AI drafts → reviewed memo</text><text x="130" y="1088" fill="#344054" font-size="18" font-weight="400">Saved: raw AI outputs, recommendations.json, memo.md</text><text x="130" y="1110" fill="#344054" font-size="18" font-weight="400">Each material baseline claim links to issue/review IDs</text><rect x="1170" y="185" width="540" height="235" rx="14" fill="#f1f5ff" stroke="#d9e3f3" stroke-width="2"/><text x="1194" y="230" fill="#2151b9" font-size="22" font-weight="700">CODE CONTROLS &amp; SAVED STATE</text><text x="1194" y="267" fill="#344054" font-size="17" font-weight="400">≤50 reviews per enrichment request</text><text x="1194" y="289" fill="#344054" font-size="17" font-weight="400">One production classification worker</text><text x="1194" y="311" fill="#344054" font-size="17" font-weight="400">Validate IDs/schema/quotes before saving</text><text x="1194" y="333" fill="#344054" font-size="17" font-weight="400">Checkpoint → interrupt → resume pending</text><text x="1194" y="355" fill="#344054" font-size="17" font-weight="400">Saved run: zero automatic retries</text><text x="1194" y="377" fill="#344054" font-size="17" font-weight="400">Current retry fixtures: ≤1, known usage</text><text x="1194" y="399" fill="#344054" font-size="17" font-weight="400">Unknown charge → stop; never assume free</text><rect x="1170" y="446" width="540" height="188" rx="14" fill="#f8f2ff" stroke="#d9e3f3" stroke-width="2"/><text x="1194" y="492" fill="#7026d4" font-size="22" font-weight="700">MODEL ROLES ARE DIFFERENT</text><text x="1194" y="530" fill="#344054" font-size="17" font-weight="400">Jev: classify; separate blind verification</text><text x="1194" y="550" fill="#344054" font-size="17" font-weight="400">Qwen: issue naming; separate memo drafting</text><text x="1194" y="570" fill="#344054" font-size="17" font-weight="400">VADER: dictionary/rule sentiment, local</text><text x="1194" y="590" fill="#344054" font-size="17" font-weight="400">Code: grouping, ranking and validation</text><text x="1194" y="610" fill="#344054" font-size="17" font-weight="400">Editorial review: evidence and wording</text><text x="1194" y="630" fill="#344054" font-size="17" font-weight="400">Models do not own arithmetic.</text><rect x="1170" y="664" width="540" height="345" rx="14" fill="#ecf8f3" stroke="#b9ddd0" stroke-width="2"/><text x="1194" y="710" fill="#147c5b" font-size="21" font-weight="700">DATABASE → BACKEND → DASHBOARD</text><text x="1194" y="750" fill="#344054" font-size="17" font-weight="400">Supabase Free</text><text x="1194" y="771" fill="#344054" font-size="17" font-weight="400">244,582 private processed review rows</text><text x="1194" y="792" fill="#344054" font-size="17" font-weight="400">15,825 issue memberships; 6 artifacts</text><text x="1194" y="813" fill="#344054" font-size="17" font-weight="400"></text><text x="1194" y="834" fill="#344054" font-size="17" font-weight="400">Vercel Python backend</text><text x="1194" y="855" fill="#344054" font-size="17" font-weight="400">GET /api/dashboard reads saved artifact</text><text x="1194" y="876" fill="#344054" font-size="17" font-weight="400"></text><text x="1194" y="897" fill="#344054" font-size="17" font-weight="400">Public dashboard</text><text x="1194" y="918" fill="#344054" font-size="17" font-weight="400">Metrics, baseline + sensitivity,</text><text x="1194" y="939" fill="#344054" font-size="17" font-weight="400">reviewed recommendations and source IDs</text><text x="1194" y="960" fill="#344054" font-size="17" font-weight="400"></text><text x="1194" y="981" fill="#344054" font-size="17" font-weight="400">Saved evidence → published analysis</text><path d="M1138,1088 L1154,1088" fill="none" stroke="#147c5b" stroke-width="3"/><path d="M1154,1088 L1154,885" fill="none" stroke="#147c5b" stroke-width="3"/><path d="M1154,885 L1170,885" fill="none" stroke="#147c5b" stroke-width="3"/><rect x="1170" y="1038" width="540" height="165" rx="14" fill="#fff8ed" stroke="#e7d2ae" stroke-width="2"/><text x="1194" y="1083" fill="#94631c" font-size="22" font-weight="700">INTERPRETATION LIMITS</text><text x="1194" y="1120" fill="#344054" font-size="17" font-weight="400">Completion-based subset, not random</text><text x="1194" y="1142" fill="#344054" font-size="17" font-weight="400">Same-model agreement ≠ human accuracy</text><text x="1194" y="1164" fill="#344054" font-size="17" font-weight="400">Severity-sum priority ignores sentiment</text><text x="1194" y="1186" fill="#344054" font-size="17" font-weight="400">No full-corpus pass or final bill claimed</text><text x="52" y="1188" fill="#667085" font-size="18" font-weight="400">Code computes membership and ranking together before Qwen names the groups.</text><text x="52" y="1223" fill="#147c5b" font-size="18" font-weight="700">Review ID → labels → issue membership → ranking → memo claim</text><text x="52" y="1257" fill="#667085" font-size="17" font-weight="400">Reference: grading/ · cost/ · reports/completed_subset/ · src/spotify_pipeline/</text></g></svg>